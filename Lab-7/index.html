<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №7</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  
<main class="page">
  <section class="addresses-wrapper">
    <address class="address">
      <img src="https://icons.veryicon.com/png/o/miscellaneous/monochrome-linear-icon-library/address-90.png" alt="Location icon" class="address__icon">
      <strong class="address__header">Address 1</strong><br><br>
      Box 564, Huston<br>
      <em>USA</em>
      <a class="address__delete-btn" title="Видалити" href="#">&times;</a>
      <img src="https://fleetsupport.mobilelinkgen.com/hc/article_attachments/360086975611/ReadyStatus.svg" alt="Default address" alt="Location status"  class="address__status" title="Вибрати за замовчуванням">
    </address>
    <address class="address">
      <img src="https://icons.veryicon.com/png/o/miscellaneous/monochrome-linear-icon-library/address-90.png" alt="Location icon" class="address__icon">
      <strong class="address__header">Address 2</strong><br><br>
      Box 500, Helsinki<br>
      <em>Finland</em>
      <a class="address__delete-btn" title="Видалити" href="#">&times;</a>
      
    </address>
    <address class="address">
      <img src="https://icons.veryicon.com/png/o/miscellaneous/monochrome-linear-icon-library/address-90.png" alt="Location icon" class="address__icon">
      <strong class="address__header">Address 3</strong><br><br>
      Box 98, Saitama <br>
      <em>Japan</em>
      <a class="address__delete-btn" title="Видалити" href="#">&times;</a>
      
    </address>
  </section>

</html>
